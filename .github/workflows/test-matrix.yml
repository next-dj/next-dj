name: Test Matrix

on:
  workflow_call:
    inputs:
      test-command:
        description: Command to run tests (run via `uv run --no-project` against the wheel-installed venv)
        required: true
        type: string
      upload-codecov:
        description: Upload coverage to Codecov
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        # Each cell installs the latest patch of the series (`django~=X.Y.0`). The cells
        # follow Django's own support table: Python 3.15 needs Django 6.1.
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.15"
            django-version: "5.2"
          - python-version: "3.15"
            django-version: "6.0"

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: |
          pyproject.toml
          tests
          .github
        sparse-checkout-cone-mode: false
    - name: Download prebuilt wheel and requirements
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: next-dj-dist
        path: dist
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.2"
    - name: Create venv and install wheel + dev requirements
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install -r dist/requirements-dev.txt
        uv pip install --no-deps --force-reinstall dist/*.whl
    - name: Install Django ${{ matrix.django-version }}
      run: uv pip install "django~=${{ matrix.django-version }}.0"
    - name: Verify Django version
      run: |
        uv run --no-project python -c 'import django; print(f"Django version: {django.get_version()}")'
    - name: Run tests
      env:
        REDIS_URL: redis://localhost:6379/0
      run: ${{ inputs.test-command }}
    - name: Upload coverage to Codecov
      if: inputs.upload-codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: inputs.upload-codecov && !cancelled()
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
