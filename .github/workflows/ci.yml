name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install Node dependencies
      run: npm ci
    - name: Build the runtime and its lazy chunks
      run: npm run build:next
    - uses: ./.github/actions/setup-python-uv
    - name: Build wheel and sdist
      env:
        NEXT_DJ_SKIP_JS_BUILD: "1"
      run: uv build
    - name: Export locked dev requirements
      run: uv export --no-hashes --group dev --format requirements-txt --no-emit-project --output-file dist/requirements-dev.txt
    - name: Export locked e2e requirements
      run: uv export --no-hashes --only-group e2e --format requirements-txt --no-emit-project --output-file dist/requirements-e2e.txt
    - name: Upload dist artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: next-dj-dist
        path: dist/
        retention-days: 1
        if-no-files-found: error

  test:
    needs: build
    uses: ./.github/workflows/test-matrix.yml
    with:
      test-command: "uv run --no-project pytest tests/ -v --junitxml=junit.xml --cov=next --cov-report=xml --cov-report=term-missing --cov-fail-under=100"
      upload-codecov: true
    secrets: inherit

  test-examples:
    needs: build
    uses: ./.github/workflows/test-examples.yml
    secrets: inherit

  test-compat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-python-uv
    - name: Install compat dependencies
      run: uv sync --locked --group compat
    - name: Run ecosystem compatibility tests
      run: uv run pytest tests/compat -q --no-cov

  # The matrix tests the wheel on a sparse checkout without next/client and docs/, so the
  # tests that compare the core with those trees skip there and run here instead.
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-python-uv
    - name: Run the tests that read the source checkout
      run: uv run pytest tests/static/test_chunk_sync.py tests/checks/test_init.py --no-cov -rs --junitxml=source.xml
    - name: Fail on a skipped test
      run: |
        uv run --no-sync python - <<'EOF'
        import xml.etree.ElementTree as ET

        root = ET.parse("source.xml").getroot()
        skipped = sum(int(suite.get("skipped", 0)) for suite in root.iter("testsuite"))
        if skipped:
            raise SystemExit(f"::error::{skipped} source checkout test(s) skipped")
        EOF

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-python-uv
    - name: Lint with ruff
      run: uv run ruff check next/
    - name: Check code formatting
      run: uv run ruff format --check next/

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-python-uv
    - name: Type check with mypy
      run: uv run mypy next/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-python-uv
    - name: Check for typos
      run: uv run pre-commit run typos --all-files
    - name: Check uv lock file
      run: uv run pre-commit run uv-lock --all-files

  docs:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: django.conf.global_settings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-python-uv
      - name: Check prose semantic newlines
        run: uv run python docs/prose_lint.py docs/content
      - name: Check documentation code snippets
        run: uv run python docs/snippet_lint.py docs/content
      - name: Install docs dependencies as Read the Docs does
        run: uv sync --frozen --no-dev --group docs
      - name: Build documentation (fail on warnings)
        run: uv run --no-sync sphinx-build -T -W --keep-going -b html docs docs/_build
      - name: Check documentation links
        run: uv run --no-sync sphinx-build -b linkcheck docs docs/_build

  test-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install Node dependencies
      run: npm ci
    - name: Type-check TypeScript (tsc)
      run: npm run typecheck:ts
    - name: Check TypeScript formatting (Prettier)
      run: npm run format:check
    - name: Lint TypeScript (ESLint)
      run: npm run lint:js
    - name: Build the runtime and its lazy chunks
      run: npm run build:next
    - name: Check the gzip budget of the runtime and each lazy chunk
      run: |
        status=0
        for entry in next:16384 next.scripts:3584 next.stream:4096 next.ws:4096 next.csrf:768 next.poll:1024 next.dev:2048; do
          name="${entry%%:*}.min.js"
          budget="${entry##*:}"
          bytes=$(gzip -nc "next/static/next/${name}" | wc -c)
          echo "${name}: ${bytes} bytes gzip (budget ${budget} bytes)"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::${name} (${bytes} bytes gzip) exceeds its gzip budget (${budget} bytes)"
            status=1
          fi
        done
        exit "$status"
    - name: Run JavaScript unit tests with coverage
      run: npm run test:js:coverage

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      with:
        fail-on-severity: moderate
