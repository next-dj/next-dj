name: Test Examples

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        django-version: ["5.2"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        sparse-checkout: |
          pyproject.toml
          Makefile
          examples
          .github
        sparse-checkout-cone-mode: false
    - name: Download prebuilt wheel and requirements
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: next-dj-dist
        path: dist
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        version: "0.11.2"
    - name: Create venv and install wheel + dev requirements
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install -r dist/requirements-dev.txt
        uv pip install --no-deps --force-reinstall dist/*.whl
    - name: Install Django ${{ matrix.django-version }}
      run: uv pip install "django~=${{ matrix.django-version }}.0"
    - name: Run example tests
      env:
        PYTEST: uv run --no-project pytest
        EXAMPLE_PYTHON: uv run --no-project python
      run: make test-examples

  test-examples-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: examples/*/package-lock.json
    - name: Run vitest for every example that ships one
      run: |
        shopt -s nullglob
        configs=(examples/*/vitest.config.*)
        if [ ${#configs[@]} -eq 0 ]; then
          echo "No example ships a vitest suite"
          exit 0
        fi
        failed=()
        for config in "${configs[@]}"; do
          dir=$(dirname "$config")
          echo "::group::$dir"
          (cd "$dir" && npm ci && npm test) || failed+=("$dir")
          echo "::endgroup::"
        done
        if [ ${#failed[@]} -ne 0 ]; then
          echo "Failed: ${failed[*]}"
          exit 1
        fi

  test-examples-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        sparse-checkout: |
          pyproject.toml
          Makefile
          examples
          .github
        sparse-checkout-cone-mode: false
    - name: Download prebuilt wheel and requirements
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: next-dj-dist
        path: dist
    - name: Set up Python 3.13
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.13"
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: examples/*/package-lock.json
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        version: "0.11.2"
    - name: Create venv and install wheel + dev and e2e requirements
      run: |
        uv venv --python 3.13
        uv pip install -r dist/requirements-dev.txt -r dist/requirements-e2e.txt
        uv pip install --no-deps --force-reinstall dist/*.whl
        uv pip install "django~=5.2.0"
    # The browser binaries pin to the playwright release, and uv.lock is outside the
    # sparse checkout, so the exported requirements file is what keys the cache.
    - name: Cache the playwright browsers
      id: browser-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('dist/requirements-e2e.txt') }}
    - name: Install chromium with its system dependencies
      if: steps.browser-cache.outputs.cache-hit != 'true'
      run: uv run --no-project playwright install --with-deps chromium
    # A cache hit restores the browsers but never the apt packages they link against.
    - name: Install the system dependencies chromium links against
      if: steps.browser-cache.outputs.cache-hit == 'true'
      run: uv run --no-project playwright install-deps chromium
    # A machine without playwright skips the browser suites with a warning rather than
    # failing, so the job asserts they are collectable before trusting a green run.
    - name: Verify the browser suites collect
      run: |
        set -e
        total=0
        for example_dir in examples/*/; do
          if [ -d "$example_dir/tests/e2e" ]; then
            count=$(cd "$example_dir" && uv run --no-project pytest tests/e2e \
              -p e2e_support.browser --no-cov --collect-only -q 2>/dev/null \
              | grep -c "::" || true)
            echo "$example_dir -> $count"
            total=$((total + count))
          fi
        done
        if [ "$total" -eq 0 ]; then
          echo "ERROR: no browser test was collected"
          exit 1
        fi
    - name: Run the browser end-to-end suites
      env:
        PYTEST_E2E: uv run --no-project pytest -o faulthandler_timeout=120
      run: make test-examples-e2e E2E_BUILD=build-examples
    - name: Upload playwright artifacts from failures
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-artifacts
        path: examples/*/test-results/
        retention-days: 7
