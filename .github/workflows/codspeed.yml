name: CodSpeed

on:
  push:
    branches: [main]
    paths: &codspeed-paths
      - "next/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-python-uv/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *codspeed-paths
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_FLAGS: >-
    --codspeed
    --durations=15
    -W "ignore:Simulation instrument ignores rounds:UserWarning"
    -W "ignore:Memory instrument ignores rounds:UserWarning"
    -p no:randomly
    --no-cov
    --override-ini=addopts=

jobs:
  instrumented:
    name: CodSpeed ${{ matrix.mode }} (shard ${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          cache: "true"
          cache-key-suffix: codspeed-py-3.13

      - name: Sync the CodSpeed group
        run: uv sync --locked --dev --group codspeed --python 3.13

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: ${{ matrix.mode }}
          run: >-
            uv run --no-sync pytest tests/benchmarks
            -m perf
            --test-group=${{ matrix.shard }}
            --test-group-count=4
            ${{ env.PYTEST_FLAGS }}

  walltime:
    name: CodSpeed walltime
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          cache: "true"
          cache-key-suffix: codspeed-walltime-py-3.13

      - name: Sync the CodSpeed group
        run: uv sync --locked --dev --group codspeed --python 3.13

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: >-
            uv run --no-sync pytest tests/benchmarks
            -m "perf and walltime"
            --codspeed-warmup-time=0.5
            --codspeed-max-time=1.5
            ${{ env.PYTEST_FLAGS }}
