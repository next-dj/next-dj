name: CodSpeed

on:
  push:
    branches: [main]
    paths: &codspeed-paths
      - "next/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-python-uv/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *codspeed-paths
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  codspeed:
    name: CodSpeed (shard ${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          cache: "true"
          cache-key-suffix: codspeed-py-3.13

      - name: Sync the CodSpeed group
        run: uv sync --locked --dev --group codspeed --python 3.13

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: >-
            uv run --no-sync pytest tests/benchmarks
            -m perf
            --codspeed
            --test-group=${{ matrix.shard }}
            --test-group-count=${{ strategy.job-total }}
            --durations=15
            -W "ignore:Simulation instrument ignores rounds:UserWarning"
            -p no:randomly
            --no-cov
            --override-ini=addopts=
