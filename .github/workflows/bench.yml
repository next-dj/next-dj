name: Benchmarks

on:
  push:
    branches: [main]
    paths: &bench-paths
      - "next/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-python-uv/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *bench-paths

# Main pushes are not cancelled so the gh-pages auto-push cannot be left half-committed.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Sized for shared GitHub runners, where more rounds buy noise, not signal.
  BENCH_FLAGS: >-
    -m perf
    --benchmark-only
    --benchmark-warmup=on
    --benchmark-warmup-iterations=1000
    --benchmark-max-time=0.2
    --benchmark-min-rounds=10
    --benchmark-disable-gc
    --benchmark-storage=file://./.benchmarks
    --benchmark-columns=mean,stddev,rounds
    --benchmark-sort=mean
    --benchmark-time-unit=auto
    -p no:randomly
    --no-cov
    --override-ini=addopts=
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Paired comparison via `git worktree`, artefact consumed by `comment` and `publish`.
  bench:
    if: >-
      ${{ (github.event_name != 'pull_request'
           || (!github.event.pull_request.draft
               && !contains(github.event.pull_request.title, '[skip bench]')))
          && !contains(github.event.head_commit.message, '[skip bench]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HEAD with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve and validate base / head SHAs
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            head="${{ github.sha }}"
            base="$(git rev-parse "$head^" 2>/dev/null || echo "$head")"
          fi
          git fetch --no-tags --depth=1 origin "$base" || true
          git cat-file -e "${base}^{commit}" || {
            echo "::error::Base SHA $base is not reachable, aborting."
            exit 1
          }
          git cat-file -e "${head}^{commit}"
          {
            echo "base=$base"
            echo "base_short=${base:0:8}"
            echo "head=$head"
            echo "head_short=${head:0:8}"
            echo "pr=${{ github.event.pull_request.number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          cache: "true"
          cache-key-suffix: bench-py-3.13

      - name: Create base worktree
        run: git worktree add --detach ../base "${{ steps.shas.outputs.base }}"

      - name: Sync base dependencies
        working-directory: ../base
        run: uv sync --locked --dev --python 3.13

      - name: Bench BASE
        working-directory: ../base
        run: |
          set -o pipefail
          uv run pytest tests/benchmarks $BENCH_FLAGS \
            --benchmark-save=base \
            --benchmark-json=bench-base.json
          mkdir -p "${{ github.workspace }}/.benchmarks"
          cp -R .benchmarks/. "${{ github.workspace }}/.benchmarks/"
          cp bench-base.json "${{ github.workspace }}/bench-base.json"

      - name: Sync head dependencies
        run: uv sync --locked --dev --python 3.13

      # `*_base` matches `0001_base.json` whatever the auto-counter did.
      # The percentage parser enforces 0 < N < 100, so 99% is the strictest gate available.
      # It compares medians because a scheduling spike moves the mean and a regression does not.
      - name: Bench HEAD and gate
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest tests/benchmarks $BENCH_FLAGS \
            --benchmark-save=head \
            --benchmark-json=bench-head.json \
            --benchmark-compare='*_base' \
            --benchmark-compare-fail=median:99% \
            2>&1 | tee bench-compare.txt

      - name: Shrink bench JSON and warn on median drift over 30%
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          # Best-effort, as the `always()` above implies. The gate has already run,
          # so a truncated report must not turn a passing bench job red.
          reports = {}
          for name in ("bench-base.json", "bench-head.json"):
              path = Path(name)
              if not path.is_file() or not path.stat().st_size:
                  continue
              try:
                  with path.open() as fh:
                      report = json.load(fh)
              except json.JSONDecodeError as exc:
                  print(f"::warning::{name} is not readable JSON, left as is ({exc})")
                  continue
              for bench in report.get("benchmarks", []):
                  bench.get("stats", {}).pop("data", None)
              with path.open("w") as fh:
                  json.dump(report, fh)
              reports[name] = report

          # Never make this fail, or the shared-runner noise the median gate avoids comes back.
          if len(reports) < 2:
              print("::notice::bench JSON missing, skipping the median drift tier.")
          else:
              base = {
                  bench["fullname"]: bench["stats"]["median"]
                  for bench in reports["bench-base.json"]["benchmarks"]
              }
              for bench in reports["bench-head.json"]["benchmarks"]:
                  ref = base.get(bench["fullname"])
                  if not ref:
                      continue
                  ratio = bench["stats"]["median"] / ref
                  if ratio >= 1.3:
                      print(
                          "::warning title=bench median drift::"
                          f"{bench['fullname']} median is x{ratio:.2f} of base"
                      )
          PY

      - name: Build comment body and pin PR number
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## next-dj benchmarks"
            echo
            echo "Same-runner paired comparison on \`ubuntu-latest\` (Python 3.13)."
            echo "Base \`${{ steps.shas.outputs.base_short }}\` → head \`${{ steps.shas.outputs.head_short }}\`."
            echo "Hard-fail threshold: \`median:99%\` (≈ ×2 of base, the parser's max)."
            echo
            case "${{ steps.gate.outcome }}" in
              failure) echo "**Result:** :red_circle: hard regression detected." ;;
              success) echo "**Result:** :green_circle: within tolerance." ;;
              *)       echo "**Result:** :grey_question: bench did not finish (\`${{ steps.gate.outcome }}\`). See workflow logs." ;;
            esac
            echo
            echo '<details><summary>Comparison table</summary>'
            echo
            echo '```'
            if [ -s bench-compare.txt ]; then
              cat bench-compare.txt
            else
              echo "(no comparison output — bench failed before producing a table)"
            fi
            echo '```'
            echo
            echo '</details>'
          } > bench-comment.md
          echo "${{ steps.shas.outputs.pr }}" > pr-number.txt

      - name: Append to job summary
        if: always()
        run: cat bench-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ steps.shas.outputs.head_short }}-${{ github.run_attempt }}
          path: |
            bench-comment.md
            bench-compare.txt
            bench-base.json
            bench-head.json
            pr-number.txt
          retention-days: 14
          if-no-files-found: error

      - name: Fail job on hard regression
        if: ${{ steps.gate.outcome == 'failure' }}
        run: |
          echo "::error::pytest-benchmark compare-fail tripped (median ratio ≥ 2× of base)."
          exit 1

  # Runs even on a tripped gate so authors see the table. Forks skip the posting step.
  comment:
    needs: bench
    if: ${{ github.event_name == 'pull_request' && always() && needs.bench.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download bench artefact
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: ./_bench

      - name: Read PR number
        id: pr
        run: |
          set -euo pipefail
          if [ ! -s ./_bench/pr-number.txt ] || [ ! -s ./_bench/bench-comment.md ]; then
            echo "::warning::bench artefact missing pr-number.txt or bench-comment.md, skipping comment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(tr -d '[:space:]' < ./_bench/pr-number.txt)
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post / update sticky PR comment
        if: ${{ steps.pr.outputs.skip != 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: next-dj-benchmarks
          number: ${{ steps.pr.outputs.number }}
          path: ./_bench/bench-comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reuses the bench artefact rather than re-running the benchmarks.
  publish:
    needs: bench
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.bench.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download bench artefact
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: ./_bench

      - name: Push HEAD numbers to gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: next-dj benchmarks
          tool: pytest
          output-file-path: ./_bench/bench-head.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          comment-always: false
          comment-on-alert: false
          summary-always: true
          alert-threshold: "200%"
          fail-on-alert: false
