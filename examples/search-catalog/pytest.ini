[pytest]
testpaths = tests
pythonpath = . ../_shared
python_files = test_*.py tests.py
DJANGO_SETTINGS_MODULE = config.settings
markers =
    django_db: tests that use the Django database
    e2e: browser test driven by playwright against a live server
addopts = -p no:benchmark -p next.testing.plugin
next_pages = catalog/storefront
next_clear_cache = true
